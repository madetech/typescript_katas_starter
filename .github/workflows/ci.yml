name: CI

on:
  # Only `main` on push. PR branches are covered by pull_request below, so
  # listing both here would run every PR push twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # These starters change rarely, so without a scheduled run the first sign of a
  # broken toolchain would be someone hitting it mid-kata. Monthly is plenty.
  schedule:
    - cron: "0 6 1 * *"

# Supersede an in-flight run when the same ref is pushed again, rather than
# leaving both to compete for runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads mise.toml, so CI uses exactly the versions you use locally.
      - uses: jdx/mise-action@v4
      - run: mise run test
