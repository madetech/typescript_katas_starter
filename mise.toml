# Single source of truth for this repo's toolchain.
# CI (.github/workflows/ci.yml) and the Dockerfile both read this file,
# so bumping a version here updates every environment at once.

[tools]
bun = "1.3"

[tasks.test]
description = "Run all tests once"
run = "bun test"

[tasks.watch]
description = "Re-run tests on every change"
run = "bun test --watch"

[tasks.coverage]
description = "Run all tests with a coverage report"
run = "bun test --coverage"
