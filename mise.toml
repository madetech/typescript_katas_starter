# Single source of truth for this repo's toolchain.
# CI (.github/workflows/ci.yml) and the Dockerfile both read this file,
# so bumping a version here updates every environment at once.

[tools]
node = "24"

[tasks.install]
description = "Install dependencies (no-op when they are already up to date)"
run = "npm install --silent --no-audit --no-fund"

[tasks.test]
description = "Run all tests once"
depends = ["install"]
run = "npx vitest run"

[tasks.watch]
description = "Re-run tests on every change"
depends = ["install"]
run = "npx vitest"

[tasks.coverage]
description = "Run all tests with a coverage report"
depends = ["install"]
run = "npx vitest run --coverage"

[tasks.typecheck]
description = "Type-check without running the tests"
depends = ["install"]
run = "npx tsc --noEmit"
